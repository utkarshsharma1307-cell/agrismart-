<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title data-i18n="navFertilizer">Fertilizer Calculator - AgriProtect</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet"><script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script><link rel="stylesheet" href="css/styles.css"></head><body><div class="app-layout"><aside class="sidebar"><a href="index.html" class="sidebar-header"><img src="img/logo.jpeg" alt="AgriProtect logo" class="sidebar-logo"><div class="sidebar-brand" data-i18n="appName">AgriProtect</div></a><nav class="sidebar-nav"><a href="index.html" class="nav-item"><i data-lucide="globe"></i><span>Home</span></a><a href="dashboard.html" class="nav-item"><i data-lucide="home"></i><span data-i18n="navDashboard">Dashboard</span></a><a href="soil-health.html" class="nav-item"><i data-lucide="leaf"></i><span data-i18n="navSoilHealth">Soil Health</span></a></nav><div style="padding:var(--space-lg);border-top:1px solid var(--color-border-subtle);"><button class="nav-item" type="button" data-logout><i data-lucide="log-out"></i><span data-i18n="logout">Logout</span></button></div></aside><div class="sidebar-overlay"></div><main class="app-main"><header class="app-header"><div class="flex items-center gap-md"><button class="btn btn-icon mobile-menu-trigger" data-sidebar-toggle type="button"><i data-lucide="menu"></i></button><h1 class="page-title" data-i18n="navFertilizer">Fertilizer Calculator</h1></div><div class="flex items-center gap-sm"><button class="btn btn-icon" data-theme-toggle type="button"><i data-lucide="moon" data-theme-icon></i></button><button class="btn btn-icon" data-language-toggle type="button">EN</button><button class="btn btn-icon" data-logout type="button"><i data-lucide="log-out"></i></button></div></header><div class="app-content"><div class="page-header"><div><h2 data-i18n="navFertilizer">Fertilizer Calculator</h2><p class="text-muted text-sm">Estimate N-P-K nutrient requirements from crop and area.</p></div></div><section class="card"><form id="fertilizerForm"><div class="planner-form-grid"><div class="form-group"><label class="form-label" for="fertilizerCrop">Crop</label><select class="form-select" id="fertilizerCrop" name="crop"><option value="rice">Rice</option><option value="wheat">Wheat</option><option value="cotton">Cotton</option><option value="sugarcane">Sugarcane</option></select></div><div class="form-group"><label class="form-label" for="fertilizerArea">Area (acres)</label><input class="form-input" id="fertilizerArea" name="area" type="number" min="0.1" step="0.1"></div><div class="form-group"><label class="form-label" for="fertilizerSoilFactor">Soil adjustment</label><select class="form-select" id="fertilizerSoilFactor" name="soilFactor"><option value="0.8">High nutrient soil</option><option value="1" selected>Average soil</option><option value="1.2">Low nutrient soil</option></select></div></div></form></section><section class="card" style="margin-top:var(--space-lg);"><div class="calculator-output-grid"><div class="calculator-output"><span>Nitrogen (N)</span><strong id="nitrogenTotal">0 kg</strong></div><div class="calculator-output"><span>Phosphorus (P)</span><strong id="phosphorusTotal">0 kg</strong></div><div class="calculator-output"><span>Potassium (K)</span><strong id="potassiumTotal">0 kg</strong></div></div><p class="text-muted text-sm" id="fertilizerNote" style="margin-top:var(--space-lg);">Demo estimate.</p></section></div></main></div><script src="js/app.js"></script><script src="js/features.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{if(!window.Agriii.Session.requireAuth())return;});</script></body></html>
